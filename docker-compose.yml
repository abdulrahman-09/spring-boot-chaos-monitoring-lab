services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build: ./payment-service
    ports:
      - "8082:8082"
    environment:
      # Small heap + exit on OOM, so the memory drill ends in a visible container restart
      JAVA_OPTS: "-Xmx256m -XX:+ExitOnOutOfMemoryError"
    mem_limit: 512m
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx256m -XX:+ExitOnOutOfMemoryError"
      DB_URL: jdbc:postgresql://postgres:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
      PAYMENT_BASE_URL: http://payment-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docs/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin # Local demo credentials only; change in real deployments.
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Load generator. Run on demand:  docker compose run --rm k6
  k6:
    image: grafana/k6
    profiles: ["load"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      BASE_URL: http://order-service:8080
    command: run /scripts/load.js
    depends_on:
      - order-service

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
