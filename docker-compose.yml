services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  payment-service:
    build: ./payment-service
    ports:
      - "8082:8082"
    env_file:
      - ./payment-service/payment-service.environment
    mem_limit: 512m
    restart: unless-stopped

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    env_file:
      - ./order-service/order-service.environment
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shop
      DB_USER: shop
      DB_PASSWORD: shop
      PAYMENT_BASE_URL: http://payment-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver # Accept trace-derived metrics from Tempo.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docs/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin # Local demo credentials only; change in real deployments.
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  # Load generator. Run on demand:  docker compose run --rm k6
  k6:
    image: grafana/k6
    profiles: ["load"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      BASE_URL: http://order-service:8080
    command: run /scripts/load.js
    depends_on:
      - order-service
  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "127.0.0.1:3200:3200" # Grafana uses the internal service address.
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/data/tempo
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  tempo-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data/tempo"]
    volumes:
      - tempo-data:/data/tempo
    restart: "no"

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yml"]
    user: "0:0"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./monitoring/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
