global:
  scrape_interval: 5s      # Scrape applications every 5 seconds.
  scrape_timeout: 4s       # Must be shorter than scrape_interval.
  evaluation_interval: 5s  # Re-evaluate alert rules every 5 seconds.
scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-service:8081"] # Docker-network address, not localhost:8081.

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]