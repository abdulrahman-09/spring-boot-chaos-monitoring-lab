receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318 # Containers must be able to reach this receiver.

processors:
  batch: {} # Batches spans before export, reducing backend requests.

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
