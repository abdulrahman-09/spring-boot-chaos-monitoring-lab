server:
  port: ${PORT:8082}

spring:
  application:
    name: payment-service

# Failure-injection endpoints (/chaos/**). Practice project only: never enable in production.
chaos:
  enabled: ${CHAOS_ENABLED:true}

management:
  server:
    port: 8083 # Separate from the public payment API on 8082.
  endpoints:
    web:
      exposure:
        include: health,prometheus # Keep the management surface deliberately small.
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true # Also provides /livez and /readyz on port 8082.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState # This stateless service has no database.
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

